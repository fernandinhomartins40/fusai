# nginx INTERNO do compose (fuseai-nginx), atrás do nginx do host. Uma porta só (3500 no host).
# Roteia pelo Host que o nginx do host repassa:
#   api.fusai.com.br              -> api:4000  (OpenAI-compatível, SSE, MCP, webhooks)
#   www.fusai.com.br, fusai.com.br -> web:3000 (Next: landing, painel, docs, /pay)

# O IP real do cliente vem do nginx do host (rede docker -> host).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

# Two API replicas. least_conn keeps long chat streams from piling on one of them. A replica
# that refuses connections (restarting during a deploy) is skipped for 10 s.
upstream fuseai_api {
  least_conn;
  server api:4000 max_fails=3 fail_timeout=10s;
  server api2:4000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}
upstream fuseai_web { server web:3000; keepalive 16; }

map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# API
server {
  listen 80;
  server_name api.fusai.com.br;

  # Corpo do chat pode ter imagens (limite da API: 20 MB).
  client_max_body_size 21m;

  location / {
    proxy_pass http://fuseai_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    # Streaming (SSE do chat, MCP): sem buffer e com tempo de resposta longo.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # Retry on the other replica only when the connection failed. nginx never resends a POST
    # (chat, payments) once it reached an API, so a charge cannot run twice.
    proxy_next_upstream error;
    proxy_next_upstream_tries 2;
  }
}

# Web (padrão: qualquer outro Host)
server {
  listen 80 default_server;
  server_name www.fusai.com.br fusai.com.br _;

  client_max_body_size 2m;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://fuseai_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
  }
}
