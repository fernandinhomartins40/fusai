# Produção na VPS compartilhada (72.60.10.112). Só o fuseai-nginx publica porta, e só em
# 127.0.0.1:3500. O nginx do HOST termina o TLS de fusai.com.br, www e api e repassa tudo
# para essa porta. Dentro do compose, o fuseai-nginx roteia pelo Host: api.* vai para a API, o resto para a web.
#
# Uso (só pelo deploy.sh, chamado pelo GitHub Actions):
#   docker compose -f docker-compose.vps.yml --env-file .env --env-file images.env up -d
# `.env` (segredos, gerado na 1ª vez na própria VPS) e `images.env` (imagens por digest)
# nunca vão para o repositório.
name: fuseai

# Log rotation explicit per service (PIE V-07): containers created before the host's
# daemon.json had none, and a recreated container must not depend on the host.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Limits (PIE V-06), on a shared 2 vCPU / 7.75 GB host. Measured at rest on 2026-10-21: the
# whole stack used ~384 MiB and ~0 % CPU. `cpus` is a ceiling, not a reservation: each service
# can still burst up to it, but none can take both vCPUs from the ~11 other apps. Sum of cpus
# ceilings = 4.25 (overcommit is fine: they rarely peak together). mem_limit values are the
# ones already in use (2-4x the measured usage). pids_limit stops fork bombs and leaks.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://fuseai:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/fuseai
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: fuseai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuseai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: fuseai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuseai -d fuseai"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: fuseai-redis
    restart: unless-stopped
    # BullMQ exige noeviction: uma chave de job removida por falta de memória perde o job.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    cpus: "0.5"
    pids_limit: 128
    logging: *logging
    networks: [internal]

  api:
    image: ${FUSEAI_API_IMAGE:?defina no images.env}
    container_name: fuseai-api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # SIGTERM -> the API waits up to 55 s for requests and chat streams in flight (server.ts).
    stop_grace_period: 65s
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    logging: *logging
    networks: [internal]

  worker:
    image: ${FUSEAI_API_IMAGE:?defina no images.env}
    container_name: fuseai-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Heartbeat written after every job (deliver-webhooks runs every 30 s). The worker also
    # exits by itself after 3 min without a finished job, so `restart` brings it back.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/fusai-worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # SIGTERM -> jobs in progress finish (worker.close) before the container stops.
    stop_grace_period: 65s
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 128
    logging: *logging
    networks: [internal]

  web:
    image: ${FUSEAI_WEB_IMAGE:?defina no images.env}
    container_name: fuseai-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: https://www.fusai.com.br
      # Chamadas do servidor Next à API pela rede interna (sem sair pela internet).
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: "0.75"
    pids_limit: 256
    logging: *logging
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    container_name: fuseai-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3500:80"
    # A PASTA inteira, não um arquivo: o rsync troca o arquivo (inode novo) e uma montagem de
    # arquivo único continuaria mostrando a versão antiga ao contêiner.
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64
    logging: *logging
    networks: [internal]

  # Daily pg_dump + automatic restore test (PIE V-01): see deploy/backup/backup.sh and
  # docs/OPERACAO.md. Same image as postgres (no extra download). Dumps go to
  # /root/fuseai/backups/daily on the host, outside the pgdata volume; the pre-deploy dumps
  # stay in /root/fuseai/backups.
  backup:
    image: postgres:16-alpine
    container_name: fuseai-backup
    restart: unless-stopped
    user: "70:70"
    entrypoint: ["sh", "/opt/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: fuseai
      PGDATABASE: fuseai
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      BACKUP_KEEP: "7"
      # 06:30 UTC = 03:30 in Brasília, the quietest hour.
      BACKUP_AT_UTC: "06:30"
    volumes:
      - ./backup:/opt/backup:ro
      - ${FUSEAI_BACKUP_DIR:-../backups/daily}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    # Unhealthy when the last verified backup is older than 26 h (failed or not running).
    healthcheck:
      test: ["CMD-SHELL", "find /backups/LAST_OK -mmin -1560 | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 64
    logging: *logging
    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
